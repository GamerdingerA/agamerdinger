[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  # The quiet theme needs Hugo 0.158.0 or newer.
  HUGO_VERSION = "0.165.0"
  HUGO_ENV = "production"
  TZ = "Europe/Copenhagen"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify -D -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -D -b $DEPLOY_PRIME_URL"

# The old research page now lives under publications.
[[redirects]]
  from = "/research/"
  to = "/publications/"
  status = 301
